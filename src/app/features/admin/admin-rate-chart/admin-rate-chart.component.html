@if (samples().length < 2) {
  <div class="rate-chart__empty" role="status">
    <p class="rate-chart__empty-title">{{ emptyTitle() }}</p>
    <p class="rate-chart__empty-text">{{ emptyText() }}</p>
  </div>
} @else {
  <svg class="rate-chart__svg" [attr.viewBox]="viewBox" role="img" aria-label="Gráfico de tasas">
    @for (tick of yTicks(); track tick.value) {
      <line
        class="rate-chart__grid"
        [attr.x1]="40"
        [attr.x2]="628"
        [attr.y1]="tick.y"
        [attr.y2]="tick.y"
      />
      <text class="rate-chart__tick" [attr.x]="36" [attr.y]="tick.y + 4" text-anchor="end">
        {{ tick.value | number: '1.0-2' }}
      </text>
    }
    @for (path of paths(); track path.key) {
      <path
        class="rate-chart__line"
        [class.rate-chart__line--primary]="path.color === 'primary'"
        [class.rate-chart__line--secondary]="path.color === 'secondary'"
        [class.rate-chart__line--accent]="path.color === 'accent'"
        [attr.d]="path.d"
        fill="none"
      />
    }
    @for (label of xLabels(); track label.x) {
      <text class="rate-chart__tick" [attr.x]="label.x" y="172" text-anchor="middle">
        {{ label.label }}
      </text>
    }
  </svg>
  <ul class="rate-chart__legend">
    @for (item of legend(); track item.key) {
      <li>
        <span
          class="rate-chart__swatch"
          [class.rate-chart__swatch--primary]="item.color === 'primary'"
          [class.rate-chart__swatch--secondary]="item.color === 'secondary'"
          [class.rate-chart__swatch--accent]="item.color === 'accent'"
        ></span>
        {{ item.label }}
      </li>
    }
  </ul>
}

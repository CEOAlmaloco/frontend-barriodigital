<div class="legal-shell">
  <header class="legal-shell__header">
    <p class="legal-shell__back">
      <a routerLink="/">Volver</a>
    </p>
    <nav class="legal-shell__nav" aria-label="Secciones legales">
      <a routerLink="/legal/terminos" routerLinkActive="is-active">Términos</a>
      <a routerLink="/legal/privacidad" routerLinkActive="is-active">Privacidad</a>
      <a routerLink="/legal/cookies" routerLinkActive="is-active">Cookies</a>
      <a routerLink="/legal/accesibilidad" routerLinkActive="is-active">Accesibilidad</a>
    </nav>
  </header>

  <router-outlet />

  <footer class="legal-shell__footer">
    <p class="legal-shell__contact">
      ¿Dudas o reclamos?
      <a [href]="'mailto:' + supportEmail">Contacto</a>
      <span aria-hidden="true"> · </span>
      <button type="button" class="legal-shell__cookie-btn" (click)="openCookieSettings()">
        Configurar cookies
      </button>
    </p>
  </footer>
</div>

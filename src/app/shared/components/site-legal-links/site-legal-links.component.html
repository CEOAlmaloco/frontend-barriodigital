<nav class="legal-links" aria-label="Información legal">
  <a class="legal-links__item" routerLink="/legal/terminos">Términos de uso</a>
  <span class="legal-links__sep" aria-hidden="true">·</span>
  <a class="legal-links__item" routerLink="/legal/privacidad">Privacidad</a>
  <span class="legal-links__sep" aria-hidden="true">·</span>
  <a class="legal-links__item" routerLink="/legal/cookies">Cookies</a>
  <span class="legal-links__sep" aria-hidden="true">·</span>
  <a class="legal-links__item" routerLink="/legal/accesibilidad">Accesibilidad</a>
  @if (showContact()) {
    <span class="legal-links__sep" aria-hidden="true">·</span>
    <a class="legal-links__item" [href]="'mailto:' + supportEmail">Contacto</a>
  }
  @if (showCookieSettings()) {
    <span class="legal-links__sep" aria-hidden="true">·</span>
    <button type="button" class="legal-links__item legal-links__item--button" (click)="cookieSettings.emit()">
      Configurar cookies
    </button>
  }
</nav>

<div class="a11y" (document:click)="onDocumentClick($event)" (document:keydown.escape)="onEscape()">
  @if (isOpen()) {
    <section class="a11y__panel" id="a11y-panel" aria-labelledby="a11y-title">
      <h2 id="a11y-title" class="a11y__title">Accesibilidad</h2>
      <p class="a11y__status">Texto {{ textLabel() }}</p>
      <div class="a11y__actions">
        <button
          #firstAction
          type="button"
          class="a11y__action"
          [disabled]="accessibility.preferences().textStep === 4"
          (click)="increaseText()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Aumentar texto
        </button>
        <button
          type="button"
          class="a11y__action"
          [disabled]="accessibility.preferences().textStep === -1"
          (click)="decreaseText()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          Reducir texto
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="isContrast('high')"
          (click)="setContrast('high')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5v14"/></svg>
          Alto contraste
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="isContrast('light')"
          (click)="setContrast('light')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
          Fondo claro
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="isContrast('negative')"
          (click)="setContrast('negative')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 0 0 14z"/></svg>
          Contraste negativo
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="isContrast('dark')"
          (click)="setContrast('dark')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3a8 8 0 1 0 5 14 7 7 0 1 1-5-14z"/></svg>
          Modo oscuro
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="accessibility.preferences().grayscale"
          (click)="toggleGrayscale()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor" stroke="none"/></svg>
          Daltonismo
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="accessibility.preferences().readableFont"
          (click)="toggleReadableFont()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 12 5l6 13M8 14h8"/></svg>
          Fuente legible
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="accessibility.preferences().underlineLinks"
          (click)="toggleUnderlineLinks()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7v5a4 4 0 0 0 8 0V7M6 19h12"/></svg>
          Subrayar enlaces
        </button>
        <button
          type="button"
          class="a11y__action"
          [attr.aria-pressed]="accessibility.preferences().pauseMotion"
          (click)="togglePauseMotion()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
          Pausar animaciones
        </button>
        <button type="button" class="a11y__action a11y__action--reset" (click)="reset()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>
          Restablecer
        </button>
      </div>
    </section>
  }

  <button
    type="button"
    class="a11y__launcher"
    aria-controls="a11y-panel"
    [attr.aria-expanded]="isOpen()"
    (click)="togglePanel()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="5" r="1.6"/>
      <path d="M5 9h14M12 9v5M8 20l4-6 4 6"/>
    </svg>
    <span class="a11y__launcher-label">Accesibilidad</span>
  </button>
</div>

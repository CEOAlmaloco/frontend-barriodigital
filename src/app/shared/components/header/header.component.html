<header class="header">
  <a
    class="header__brand"
    routerLink="/inicio"
    aria-label="BarrioDigital, ir al inicio"
    (click)="closeMenu()"
  >
    <app-brand-logo class="header__logo header__logo--full" variant="horizontal" decorative />
    <app-brand-logo class="header__logo header__logo--symbol" variant="symbol" decorative />
  </a>

  <nav class="header__nav" [class.header__nav--open]="isMenuOpen()" aria-label="Navegación principal">
    <button
      mat-icon-button
      type="button"
      class="header__menu-toggle"
      aria-label="Abrir menú de navegación"
      aria-controls="header-links"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <ul id="header-links" class="header__links">
      @for (item of navItems(); track item.path) {
        <li>
          <a
            class="header__link"
            [routerLink]="item.path"
            routerLinkActive="header__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="header__account">
    <a
      class="header__account-identity"
      routerLink="/perfil"
      routerLinkActive="header__account-identity--active"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      <span class="header__account-avatar" aria-hidden="true">
        @if (accountInitials()) {
          {{ accountInitials() }}
        } @else {
          <mat-icon>person</mat-icon>
        }
      </span>
      <span class="header__account-copy">
        <span class="header__account-name">{{ accountName() }}</span>
        @if (roleLabel(); as label) {
          <span class="header__account-role">
            <span class="cdk-visually-hidden">Rol: </span>{{ label }}
          </span>
        }
      </span>
      <span class="cdk-visually-hidden"> — Mi perfil</span>
    </a>
    <button matButton type="button" class="header__sign-out" (click)="signOut()">Cerrar sesión</button>
  </div>
</header>

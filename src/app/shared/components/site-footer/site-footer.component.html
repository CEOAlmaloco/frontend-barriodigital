<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__owner">BarrioDigital, plataforma de trámites municipales</p>

    <nav class="site-footer__nav" aria-label="Información del sitio">
      <ul class="site-footer__links">
        @for (page of pages; track page.path) {
          <li>
            <a
              class="site-footer__link"
              [routerLink]="page.path"
              routerLinkActive="site-footer__link--active"
              ariaCurrentWhenActive="page"
            >
              {{ page.label }}
            </a>
          </li>
        }
        <li>
          <a class="site-footer__link" [href]="'mailto:' + supportEmail">Soporte</a>
        </li>
      </ul>
    </nav>
  </div>
</footer>

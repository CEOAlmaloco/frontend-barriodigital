customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://login.microsoftonline.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com;
          connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com
          https://graph.microsoft.com https://*.execute-api.us-east-1.amazonaws.com
          https://*.amplifyapp.com;
          frame-src https://login.microsoftonline.com;
          object-src 'none';
          base-uri 'self';
          form-action 'self' https://login.microsoftonline.com
